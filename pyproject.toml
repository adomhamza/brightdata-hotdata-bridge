[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brightdata-hotdata-bridge"
dynamic = ["version"]
description = "Trigger Bright Data scraper collections and publish the results into Hotdata tables."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adom Hamza" }]
keywords = ["brightdata", "hotdata", "web-scraping", "etl", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "hotdata>=0.11,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
bdh = "brightdata_hotdata_bridge.cli:main"

[project.urls]
Documentation = "https://github.com/adomhamza/brightdata-hotdata-bridge#readme"
Source = "https://github.com/adomhamza/brightdata-hotdata-bridge"
Issues = "https://github.com/adomhamza/brightdata-hotdata-bridge/issues"

[tool.hatch.version]
path = "src/brightdata_hotdata_bridge/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brightdata_hotdata_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", ".env.example"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PTH", "RET", "TRY", "ASYNC",
    "S", "N", "D", "ANN", "PL", "PT", "ERA", "BLE", "LOG", "G",
]
ignore = [
    "D203",    # one-blank-line-before-class conflicts with D211
    "D213",    # multi-line-summary-second-line conflicts with D212
    "TRY003",  # long messages on custom exceptions are intentional context
    "PLR0913", # explicit keyword-only signatures are clearer than option bags here
    "ANN401",  # scraped JSON records are genuinely untyped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004", "PLR0917", "S106", "S105", "PLC0415"]
"src/brightdata_hotdata_bridge/cli.py" = ["PLR0917"]  # Typer maps parameters to options

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["hotdata", "hotdata.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["brightdata_hotdata_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
