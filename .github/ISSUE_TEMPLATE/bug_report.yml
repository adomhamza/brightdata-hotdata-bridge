name: Bug report
description: Something in the library or the bdh CLI doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, tokens or workspace ids.** Remove them from commands, logs and
        `.env` excerpts before submitting. Report security problems privately through the
        Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The `bdh` command or Python code, the scraper's dataset id, and a minimal input.
      render: shell
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: The CLI's exit code, if you used the CLI (`echo $?` after the command).
  - type: textarea
    id: logs
    attributes:
      label: Logs and run record
      description: |
        Output with `--log-level DEBUG`, and `bdh status <snapshot_id> --json` if a snapshot
        was involved. Include any Hotdata trace id from the error.
      render: text
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `bdh --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: Python 3.13, macOS 26
    validations:
      required: true
